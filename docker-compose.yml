services:
  shard-0:
    build: .
    command: ["vectordb-server", "--config", "/etc/vectordb/node-0.toml"]
    volumes:
      - ./config/node-0.toml:/etc/vectordb/node-0.toml:ro
      - vdb0:/data
    ports:
      - "6334:6334"

  shard-1:
    build: .
    command: ["vectordb-server", "--config", "/etc/vectordb/node-1.toml"]
    volumes:
      - ./config/node-1.toml:/etc/vectordb/node-1.toml:ro
      - vdb1:/data
    ports:
      - "6335:6335"

  router:
    build: .
    command: ["vectordb-server", "--config", "/etc/vectordb/router.toml"]
    volumes:
      - ./config/router.toml:/etc/vectordb/router.toml:ro
    ports:
      - "6333:6333"
    depends_on:
      - shard-0
      - shard-1

  gateway:
    build: .
    command: ["vectordb-gateway"]
    environment:
      VECTORDB_GRPC: http://router:6333
      VECTORDB_HTTP: 0.0.0.0:8080
    ports:
      - "8080:8080"
    depends_on:
      - router

volumes:
  vdb0:
  vdb1:
