# RF=3 cluster: 2 shards × 3 replicas (Raft).
# Tolerates one node loss per shard with no data loss.
#
#   docker compose -f docker-compose-rf3.yml up --build
#
# Endpoints:
#   gateway HTTP : http://localhost:8080
#   admin UI     : http://localhost:8090
#   router gRPC  : localhost:6333

x-data-template: &data-template
  build: .
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "vectordb", "--endpoint", "http://localhost:6334", "health"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 5s

services:
  shard-0-r1:
    <<: *data-template
    command: ["vectordb-server", "--config", "/etc/vectordb/node.toml"]
    volumes:
      - ./config/rf3/shard-0-r1.toml:/etc/vectordb/node.toml:ro
      - vdb_s0_r1:/data

  shard-0-r2:
    <<: *data-template
    command: ["vectordb-server", "--config", "/etc/vectordb/node.toml"]
    volumes:
      - ./config/rf3/shard-0-r2.toml:/etc/vectordb/node.toml:ro
      - vdb_s0_r2:/data

  shard-0-r3:
    <<: *data-template
    command: ["vectordb-server", "--config", "/etc/vectordb/node.toml"]
    volumes:
      - ./config/rf3/shard-0-r3.toml:/etc/vectordb/node.toml:ro
      - vdb_s0_r3:/data

  shard-1-r1:
    <<: *data-template
    command: ["vectordb-server", "--config", "/etc/vectordb/node.toml"]
    volumes:
      - ./config/rf3/shard-1-r1.toml:/etc/vectordb/node.toml:ro
      - vdb_s1_r1:/data

  shard-1-r2:
    <<: *data-template
    command: ["vectordb-server", "--config", "/etc/vectordb/node.toml"]
    volumes:
      - ./config/rf3/shard-1-r2.toml:/etc/vectordb/node.toml:ro
      - vdb_s1_r2:/data

  shard-1-r3:
    <<: *data-template
    command: ["vectordb-server", "--config", "/etc/vectordb/node.toml"]
    volumes:
      - ./config/rf3/shard-1-r3.toml:/etc/vectordb/node.toml:ro
      - vdb_s1_r3:/data

  router:
    build: .
    restart: unless-stopped
    command: ["vectordb-server", "--config", "/etc/vectordb/router.toml"]
    volumes:
      - ./config/rf3/router.toml:/etc/vectordb/router.toml:ro
    ports:
      - "6333:6333"
    depends_on:
      shard-0-r1: { condition: service_started }
      shard-0-r2: { condition: service_started }
      shard-0-r3: { condition: service_started }
      shard-1-r1: { condition: service_started }
      shard-1-r2: { condition: service_started }
      shard-1-r3: { condition: service_started }

  gateway:
    build: .
    restart: unless-stopped
    command: ["vectordb-gateway"]
    environment:
      VECTORDB_GRPC: http://router:6333
      VECTORDB_HTTP: 0.0.0.0:8080
    ports:
      - "8080:8080"
    depends_on:
      - router

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    environment:
      VECTORDB_URL: http://gateway:8080
      ADMIN_LISTEN: ":8090"
      EMBED_DEFAULT_URL: http://host.docker.internal:1234/v1
      EMBED_DEFAULT_MODEL: text-embedding-nomic-embed-text-v1.5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8090"
    depends_on:
      - gateway

volumes:
  vdb_s0_r1:
  vdb_s0_r2:
  vdb_s0_r3:
  vdb_s1_r1:
  vdb_s1_r2:
  vdb_s1_r3:
