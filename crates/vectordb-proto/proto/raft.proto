syntax = "proto3";

package vectordb.raft.v1;

// Internal Raft RPCs between replicas of the same shard.

service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  // Leader streams a filesystem snapshot of the shard data directory to a
  // lagging follower. Used when AppendEntries cannot catch up (empty replica
  // or log mismatch). Client-streaming: leader sends chunks, follower acks.
  rpc InstallSnapshot(stream InstallSnapshotChunk) returns (InstallSnapshotResponse);
}

message LogRecord {
  uint64 term = 1;
  uint64 index = 2;
  bytes payload = 3;
}

message RequestVoteRequest {
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogRecord entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

// One chunk of a shard snapshot. The leader walks its on-disk snapshot
// (wal.log + meta/) and streams each file in 256 KiB pieces.
//
// Control flow:
//   * First chunk of a transfer sets term / leader_id / last_included_*.
//   * `name` is a relative path under the data root (e.g. "wal.log", "meta/000042.sst").
//   * `data` is the bytes at `offset` for that file.
//   * `done` on a chunk marks end-of-file for `name`.
//   * A chunk with `eof = true` and empty `name` completes the entire transfer.
message InstallSnapshotChunk {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  string name = 5;
  uint64 offset = 6;
  bytes data = 7;
  bool done = 8;
  bool eof = 9;
}

message InstallSnapshotResponse {
  uint64 term = 1;
  bool success = 2;
}
