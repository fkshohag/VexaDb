syntax = "proto3";

package vectordb.v1;

// VectorDB — production-oriented vector database API (Pinecone-inspired).

service VectorService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc DeleteCollection(DeleteCollectionRequest) returns (DeleteCollectionResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc DescribeCollection(DescribeCollectionRequest) returns (DescribeCollectionResponse);
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  // M4: bulk import, WAL compaction, online reindex.
  rpc BulkUpsert(BulkUpsertRequest) returns (BulkUpsertResponse);
  rpc ImportStream(stream ImportChunk) returns (ImportStreamResponse);
  rpc CompactWal(CompactWalRequest) returns (CompactWalResponse);
  rpc ReindexCollection(ReindexCollectionRequest) returns (ReindexCollectionResponse);
  // M5: rebalance / cluster admin.
  rpc Scroll(ScrollRequest) returns (ScrollResponse);
  rpc Rebalance(RebalanceRequest) returns (RebalanceResponse);
  rpc RebalanceStatus(RebalanceStatusRequest) returns (RebalanceStatusResponse);
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc ClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);
  // M6: SDK-friendly surface — filter-only retrieval and per-collection stats.
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc Stats(StatsRequest) returns (StatsResponse);
  // M7: RBAC — users, tokens, roles, grants, privilege groups.
  // The op/snapshot payloads are JSON-encoded to keep this surface
  // forward-compatible (new privilege names, new fields, new RbacOp variants).
  rpc ApplyRbac(ApplyRbacRequest) returns (ApplyRbacResponse);
  rpc GetRbacSnapshot(GetRbacSnapshotRequest) returns (GetRbacSnapshotResponse);
}

message ApplyRbacRequest {
  bytes op_json = 1;
}

message ApplyRbacResponse {}

message GetRbacSnapshotRequest {}

message GetRbacSnapshotResponse {
  bytes snapshot_json = 1;
}

enum DistanceMetric {
  DISTANCE_METRIC_UNSPECIFIED = 0;
  COSINE = 1;
  EUCLIDEAN = 2;
  DOT_PRODUCT = 3;
}

enum PayloadIndexKind {
  PAYLOAD_INDEX_KIND_UNSPECIFIED = 0;
  PAYLOAD_INDEX_KIND_KEYWORD = 1;
  PAYLOAD_INDEX_KIND_NUMERIC = 2;
  PAYLOAD_INDEX_KIND_BOOL = 3;
}

message PayloadFieldIndex {
  string field = 1;
  PayloadIndexKind kind = 2;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string node_id = 2;
  uint32 shard_count = 3;
  // Raft / replication (empty when replication is disabled).
  bool is_leader = 4;
  string raft_role = 5;
  // gRPC endpoint clients should use for writes (http://host:port).
  string leader_endpoint = 6;
  // False when replication is enabled but this node is not the leader (writes fail).
  bool ready = 7;
}

message CollectionSpec {
  string name = 1;
  uint32 dimension = 2;
  DistanceMetric metric = 3;
  uint32 m = 4;
  uint32 ef_construction = 5;
  uint32 ef_search = 6;
  repeated PayloadFieldIndex payload_indexes = 7;
  bool sparse_enabled = 8;
  string bm25_text_field = 9;
  bool scalar_quantization = 10;
}

message SparseVector {
  repeated uint32 indices = 1;
  repeated float values = 2;
}

message CreateCollectionRequest {
  CollectionSpec spec = 1;
}

message CreateCollectionResponse {}

message DeleteCollectionRequest {
  string name = 1;
}

message DeleteCollectionResponse {}

message ListCollectionsRequest {}

message ListCollectionsResponse {
  repeated string names = 1;
}

message DescribeCollectionRequest {
  string name = 1;
}

message DescribeCollectionResponse {
  CollectionSpec spec = 1;
  uint64 vector_count = 2;
}

message VectorPoint {
  string id = 1;
  repeated float values = 2;
  bytes payload = 3;
  SparseVector sparse = 4;
}

message UpsertRequest {
  string collection = 1;
  repeated VectorPoint points = 2;
}

message UpsertResponse {
  uint64 upserted = 1;
}

message SearchRequest {
  string collection = 1;
  repeated float query = 2;
  uint32 top_k = 3;
  // Restrict results to these specific IDs (post-filter).
  repeated string filter_ids = 4;
  // Filter expression encoded as JSON. See `Filter` DSL in vectordb-core.
  string filter_json = 5;
  SparseVector sparse_query = 6;
  // Lexical query for BM25 (when collection has bm25_text_field).
  string text_query = 7;
  // dense | sparse | bm25 | hybrid_rrf | hybrid_weighted
  string search_mode = 8;
  float hybrid_alpha = 9;
  // When non-empty, only these payload fields are returned (top-level keys).
  // Empty + with_payload=true means "all fields".
  repeated string output_fields = 10;
  // Include the JSON payload on each hit (default: false to keep wire small).
  bool with_payload = 11;
  // Include the dense vector on each hit (default: false). Heavy — opt in.
  bool with_vector = 12;
}

message ScoredPoint {
  string id = 1;
  float score = 2;
  // Populated when SearchRequest.with_payload is true.
  // JSON-encoded; gateway converts to a structured object.
  bytes payload = 3;
  // Populated when SearchRequest.with_vector is true.
  repeated float vector = 4;
}

message SearchResponse {
  repeated ScoredPoint hits = 1;
}

// Filter-only retrieval. Like Search but without a query vector — useful for
// "give me every point in this collection where category == 'books'".
message QueryRequest {
  string collection = 1;
  // Structured filter encoded as JSON. Mutually compatible with `filter_expr`;
  // the gateway parses string expressions and forwards them as JSON here.
  string filter_json = 2;
  // Limit results to these IDs (used to reimplement Get-many in one round-trip).
  repeated string ids = 3;
  uint32 limit = 4;
  uint32 offset = 5;
  repeated string output_fields = 6;
  bool with_payload = 7;
  bool with_vector = 8;
}

message QueryResponse {
  repeated VectorPoint points = 1;
  // Set when pagination might have more results. Empty otherwise.
  string next_cursor = 2;
}

message StatsRequest {
  string collection = 1;
}

message StatsResponse {
  string name = 1;
  uint64 vector_count = 2;
  uint32 dimension = 3;
  DistanceMetric metric = 4;
  bool sparse_enabled = 5;
  string bm25_text_field = 6;
  uint32 payload_index_count = 7;
  bool scalar_quantization = 8;
}

message DeleteRequest {
  string collection = 1;
  repeated string ids = 2;
}

message DeleteResponse {
  uint64 deleted = 1;
}

message GetRequest {
  string collection = 1;
  string id = 2;
}

message GetResponse {
  VectorPoint point = 1;
  bool found = 2;
}

message CreateSnapshotRequest {}

message SnapshotInfo {
  string id = 1;
  uint64 created_at_ms = 2;
  string path = 3;
}

message CreateSnapshotResponse {
  SnapshotInfo snapshot = 1;
}

message ListSnapshotsRequest {}

message ListSnapshotsResponse {
  repeated SnapshotInfo snapshots = 1;
}

message DeleteSnapshotRequest {
  string id = 1;
}

message DeleteSnapshotResponse {}

message BulkUpsertRequest {
  string collection = 1;
  repeated VectorPoint points = 2;
  // Max points per WAL record (default 500).
  uint32 chunk_size = 3;
}

message BulkUpsertResponse {
  uint64 upserted = 1;
}

message ImportChunk {
  string collection = 1;
  repeated VectorPoint points = 2;
  bool finalize = 3;
}

message ImportStreamResponse {
  uint64 upserted = 1;
}

// Scroll — paginate through every point on the *local* shard for a collection.
// Used by rebalance / migration tools. Cursor is opaque; pass the value
// returned in `next_cursor` to fetch the next page. Empty `next_cursor` means
// the iteration is complete.
message ScrollRequest {
  string collection = 1;
  string cursor = 2;
  uint32 limit = 3;
}

message ScrollResponse {
  repeated VectorPoint points = 1;
  string next_cursor = 2;
}

// Trigger a single rebalance sweep. Only meaningful when sent to the
// router — data nodes return FailedPrecondition. dry_run logs intended
// migrations without writing.
message RebalanceRequest {
  bool dry_run = 1;
}

message RebalanceCollectionReport {
  string collection = 1;
  uint64 moved = 2;
  uint64 kept = 3;
  uint64 failed = 4;
}

message RebalanceResponse {
  uint64 moved = 1;
  uint64 kept = 2;
  uint64 failed = 3;
  uint64 duration_ms = 4;
  repeated RebalanceCollectionReport per_collection = 5;
}

message RebalanceStatusRequest {}

message RebalanceStatusResponse {
  bool running = 1;
  bool enabled = 2;
  uint64 interval_secs = 3;
  uint64 last_started_unix_ms = 4;
  uint64 last_finished_unix_ms = 5;
  uint64 last_duration_ms = 6;
  uint64 last_moved = 7;
  uint64 last_kept = 8;
  uint64 last_failed = 9;
  string last_error = 10;
  uint64 total_moves = 11;
  uint64 total_sweeps = 12;
}

// Data nodes call this on startup and periodically (heartbeat). The router
// merges registrations with static config and runs health probes.
message RegisterNodeRequest {
  string node_id = 1;
  string grpc = 2;
  repeated uint32 shard_ids = 3;
  uint32 shard_count = 4;
}

message RegisterNodeResponse {
  bool accepted = 1;
  uint32 shard_count = 2;
}

message ClusterStatusRequest {}

message ClusterNodeStatus {
  string id = 1;
  string grpc = 2;
  repeated uint32 shard_ids = 3;
  bool healthy = 4;
  bool ready = 5;
  bool is_leader = 6;
  string source = 7;
  repeated uint32 primary_for_shards = 8;
}

message ClusterStatusResponse {
  uint32 shard_count = 1;
  uint64 replication_factor = 2;
  repeated ClusterNodeStatus nodes = 3;
  uint64 last_health_unix_ms = 4;
  uint64 last_config_reload_unix_ms = 5;
}

message CompactWalRequest {
  // When true, create a filesystem snapshot before compacting the WAL.
  bool snapshot_first = 1;
}

message CompactWalResponse {
  uint64 entries_before = 1;
  uint64 entries_after = 2;
  SnapshotInfo snapshot = 3;
}

message ReindexCollectionRequest {
  string collection = 1;
}

message ReindexCollectionResponse {
  uint64 vectors_reindexed = 1;
}
