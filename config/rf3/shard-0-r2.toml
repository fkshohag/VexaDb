[server]
listen = "0.0.0.0:6334"

[storage]
data_dir = "./data/shard-0-r2"
sync_wal = true

[cluster]
node_id = "shard-0-r2"
role = "data"
shard_count = 2
shard_id = 0

[snapshot]
interval_secs = 300
compact_wal = true
min_wal_entries = 100

[raft]
node_id = 12
listen = "0.0.0.0:7334"
vector_endpoint = "http://shard-0-r2:6334"
election_timeout_ms = 750
heartbeat_interval_ms = 150

[[raft.peers]]
id = 11
addr = "shard-0-r1:7334"
grpc = "http://shard-0-r1:6334"

[[raft.peers]]
id = 12
addr = "shard-0-r2:7334"
grpc = "http://shard-0-r2:6334"

[[raft.peers]]
id = 13
addr = "shard-0-r3:7334"
grpc = "http://shard-0-r3:6334"
