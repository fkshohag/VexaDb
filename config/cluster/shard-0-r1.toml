# State of record: .cluster.state.json

[server]
listen = "0.0.0.0:6334"

[storage]
data_dir = "/data"
sync_wal = true

[cluster]
node_id = "shard-0-r1"
role = "data"
shard_count = 5
shard_id = 0
replication_factor = 2
router_grpc = "http://router:6333"

# Auto-snapshot every 5 minutes (compacts WAL, speeds future cold starts)
[snapshot]
interval_secs = 300
compact_wal = true
min_wal_entries = 100

[raft]
node_id = 1
listen = "0.0.0.0:7334"
vector_endpoint = "http://shard-0-r1:6334"
election_timeout_ms = 750
heartbeat_interval_ms = 150

[[raft.peers]]
id = 1
addr = "shard-0-r1:7334"
grpc = "http://shard-0-r1:6334"

[[raft.peers]]
id = 2
addr = "shard-0-r2:7334"
grpc = "http://shard-0-r2:6334"

# Replica bootstrap: empty replica pulls historical state via Scroll RPC.
# Raft InstallSnapshot supersedes this once peers are up — both are safe.
# peer_retry_secs covers the case where new + sibling replicas cold-start
# together: the sibling's gRPC isn't up during its WAL replay, so the new
# replica retries with backoff for up to 10 min instead of giving up.
[bootstrap]
enabled = true
page_size = 256
bulk_chunk_size = 256
max_total_secs = 3600
peer_retry_secs = 600
snapshot_after = true
